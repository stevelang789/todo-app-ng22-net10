  <mat-card appearance="outlined" class="w-100 m-4">
    <mat-card-header>
      <mat-card-title>Todo App</mat-card-title>
    </mat-card-header>
    <mat-card-content class="mt-4"> 
      <mat-action-list>
        @for (todoItem of todoList; track todoItem) {
          <button mat-list-item (click)="edit(todoItem.id)"><span [class.completed]="todoItem.isCompleted">{{todoItem.description}}</span></button>
        }
      </mat-action-list>
    </mat-card-content>
    <mat-card-actions>
      <button matButton="tonal" (click)="add()">New Item</button>
    </mat-card-actions>
  </mat-card>
